# Configuración del agente NomikOS — edita y reinicia:
#   systemctl restart agentd
# AGENTD_API_URL: el api del ecosistema en tu LAN (o localhost si el api
# corre en la propia placa). Sin TLS en LAN; usa un túnel/reverse-proxy
# para acceso remoto.
AGENTD_API_URL=http://192.168.1.50:8080/api
# Nombre visible del dispositivo en la flota (vacío → hostname de la placa
# se aplica en post-build; %H no se expande en EnvironmentFile).
AGENTD_NAME=nomikos-rpi4
AGENTD_BOARD=rpi4
# Estado persistente (token del dispositivo, device_id, secret): el
# servicio de voz (agentd-voice.service) lo lee para autorizar los turnos.
AGENTD_STATE=/var/lib/agentd/device.json
# Demo del peaje x402 en el primer heartbeat (1) o apagada (0).
AGENTD_X402=1
