# NomikOS (rpi4) — layout de la microSD: FAT de arranque + rootfs ext4.
# Se usa desde post-image.sh vía support/scripts/genimage.sh.
image boot.vfat {
	vfat {
		files = {
			"Image",
			"bcm2711-rpi-4-b.dtb",
			"bcm2711-rpi-400.dtb",
			"bcm2711-rpi-cm4.dtb",
			"config.txt",
			"cmdline.txt"
		}
	}
	size = 256M
}

image sdcard.img {
	hdimage {}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
