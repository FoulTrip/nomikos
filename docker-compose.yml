services:
  payload-cms:
    build:
      context: ./scripts/payload-cms
      dockerfile: Dockerfile
    container_name: nomikos-payload-cms
    environment:
      PAYLOAD_SECRET: "${PAYLOAD_SECRET:-}"
    volumes:
      - payload-state:/opt/payload/templates/with-cloudflare-d1/.wrangler
      - payload-secrets:/data
    ports:
      - "3100:3100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/users').then(() => process.exit(0)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped

  # Local S3-compatible storage for the simulator model. OBJECT_STORE_BACKEND
  # The launcher activates this profile only when OBJECT_STORE_BACKEND=local.
  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: nomikos-rustfs
    profiles: ["local"]
    command: ["/data"]
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "nomikos-local"
      RUSTFS_SECRET_KEY: "nomikos-local-s3-secret"
      RUSTFS_OBS_LOGGER_LEVEL: "error"
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────
  # NomikOS — el ecosistema local en docker.
  # `docker compose up --build -d` levanta api, brain y dapp.
  # Payload también corre en Compose para que el instalador funcione en Windows y Linux.
  # Credenciales: el .env de la RAÍZ (nunca horneadas en las imágenes).
  # ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nomikos-api
    # TODO el .env central de la raíz + los overrides de red del container
    # (environment: gana sobre env_file). La regla #4: una sola fuente.
    env_file:
      - .env
    environment:
      # La app del ecosistema (a la que el agente paga peaje por petición).
      # Dentro de Compose se resuelve por el nombre del servicio.
      PAYLOAD_URL: "http://payload-cms:3100"
      PAYLOAD_EMAIL: "${PAYLOAD_EMAIL:-}"
      PAYLOAD_PASSWORD: "${PAYLOAD_PASSWORD:-}"
      PAYLOAD_TOKEN: "${PAYLOAD_TOKEN:-}"
      SOLANA_NETWORK: "${SOLANA_NETWORK:-devnet}"
      # A host-run solana-test-validator is reachable from the API container here.
      SOLANA_LOCAL_URL: "http://host.docker.internal:8899"
      SOLANA_DEVNET_URL: "${SOLANA_DEVNET_URL:-https://api.devnet.solana.org}"
      AGENT_OS_API_HOST: "0.0.0.0"
      AGENT_OS_API_PORT: "8080"
      # Orquestador (voz): dentro de Compose se resuelve por nombre de servicio.
      BRAIN_URL: "http://brain:8322"
      # Cifrado de secretos de cuentas (keypairs, api_keys) — 32 B base64.
      ACCOUNTS_MASTER_KEY: "${ACCOUNTS_MASTER_KEY:?genera con: make secrets}"
      # Verificador legal S2 (workshop): GT solo lo lee este proceso.
      VERIFIER_ENABLED: "${VERIFIER_ENABLED:-1}"
      VERIFIER_GT_DIR: "/app/ground_truth"
      VERIFIER_CASES_DIR: "/app/cases"
      VERIFIER_WORLD_TOKEN: "${VERIFIER_WORLD_TOKEN:-}"
      # Tienda de dapps: catálogo del host montado read-only (las tools
      # de apps instaladas se comparten vía DB). El INSTALL corre en el
      # host (necesita node/git): ver scripts/nomikos.
      DAPPS_REGISTRY: "/workspace/dapps/registry"
      APP_INSTALL_SCRIPT: "/workspace/scripts/install-app.sh"
      # El contenedor registra el servicio Compose y sus credenciales.
      NOMIKOS_APP_URL: "http://payload-cms:3100"
      X402_APP_LAMPORTS: "${X402_APP_LAMPORTS:-1000}"
      X402_PATH_LAMPORTS: "${X402_PATH_LAMPORTS:-1000}"
      # Selección del storage: el modo local conecta al RustFS del perfil local;
      # OBJECT_STORE_BACKEND=r2 usa las credenciales Cloudflare de abajo.
      OBJECT_STORE_BACKEND: "${OBJECT_STORE_BACKEND:-local}"
      OBJECT_STORE_ENDPOINT: "http://rustfs:9000"
      OBJECT_STORE_ACCESS_KEY_ID: "nomikos-local"
      OBJECT_STORE_SECRET_ACCESS_KEY: "nomikos-local-s3-secret"
      OBJECT_STORE_BUCKET: "nomikos-models"
      OBJECT_STORE_REGION: "us-east-1"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_REGION: "${R2_REGION:-}"
      R2_API_TOKEN: "${R2_API_TOKEN:-}"
      R2_MODEL_KEY: "${R2_MODEL_KEY:-models/ESP32-S3-Touch-AMOLED-1.43.glb}"
      R2_PUBLIC_URL_BASE: "${R2_PUBLIC_URL_BASE:-}"
      OBJECT_STORE_MODEL_KEY: "${OBJECT_STORE_MODEL_KEY:-models/ESP32-S3-Touch-AMOLED-1.43.glb}"
      # Fuente de subida inicial; el visor siempre obtiene el GLB por API/R2.
      DEVICE_MODEL_FILE: "/workspace/device-models/ESP32-S3-Touch-AMOLED-1.43.glb"
    volumes:
      # el ledger vive en el host (persiste; el api del host debe estar DOWN)
      - ./api/data:/app/data
      # registro de dapps instalado desde el host
      - ./dapps/registry:/workspace/dapps/registry:ro
      - ./scripts:/workspace/scripts:ro
      - ./dapp/public/models:/workspace/device-models:ro
      # workshop S2: casos visibles + ground truth (0600, solo este proceso)
      - ./cases:/app/cases:ro
      - ./ground_truth:/app/ground_truth:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      payload-cms:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  brain:
    build:
      context: ./brain
      dockerfile: Dockerfile
    container_name: nomikos-brain
    depends_on:
      api:
        condition: service_healthy
    environment:
      AGENT_OS_API_URL: "http://api:8080/api"
      GUARD_PROVIDER: "${GUARD_PROVIDER:-}"
      GUARD_API_URL: "${GUARD_API_URL:-}"
      GUARD_API_KEY: "${GUARD_API_KEY:-}"
      GUARD_MODEL: "${GUARD_MODEL:-}"
      GUARD_ENABLED: "${GUARD_ENABLED:-1}"
      GUARD_EXCLUDED_CATEGORIES: "${GUARD_EXCLUDED_CATEGORIES:-S6,S7,S8,S9,S14}"
      MAX_TOOL_ITERATIONS: "${MAX_TOOL_ITERATIONS:-8}"
    ports:
      - "8322:8322"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8322/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  dapp:
    build:
      context: ./dapp
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* se inyectan en BUILD time
        NEXT_PUBLIC_DEPLOYMENT: "docker"
    container_name: nomikos-dapp
    depends_on:
      - api
      - brain
    environment:
      API_GATEWAY_URL: "http://api:8080/api"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET requerido (make secrets)}"
      BRAIN_URL: "http://brain:8322"
      NEXT_PUBLIC_DEPLOYMENT: "docker"
      NOMIKOS_RUNTIME: "docker"
      NODE_ENV: "production"
      PORT: "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  payload-state:
  payload-secrets:
  rustfs-data:
